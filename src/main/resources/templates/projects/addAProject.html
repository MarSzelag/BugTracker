<!DOCTYPE html>
<html lang="en" layout:decorate="~{main-layout/mainLayout}"
      xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="container">
    <section layout:fragment="custom-content">
        <form>
            <div class="form-group">
                <label for="name">Nazwa</label>
                <input type="email" class="form-control" id="name" placeholder="Name">
            </div>
            <div class="form-group">
                <label for="projectId">Password</label>
                <input type="password" class="form-control" id="projectId" placeholder="Project ID">
            </div>
            <div class="form-group">
                <label for="description">Opis</label>
                <textarea class="form-control" id="description" rows="5"></textarea>
            </div>
            <div>
                <button class="applyChanges" type="submit">Zapisz zmiany</button>
                <button class="cancel" type="submit">Anuluj</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
